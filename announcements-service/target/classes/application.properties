
spring.application.name=announcements-service

server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/agence_immobiliere}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:agence_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:agence_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true