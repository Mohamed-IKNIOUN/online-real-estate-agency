spring.application.name=announcements-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/announcements_db}
spring.datasource.username=${DB_USERNAME:announcements_user}
spring.datasource.password=${ANNOUNCEMENTS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true