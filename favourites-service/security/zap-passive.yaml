env:
  contexts:
    - name: favourites-local
      urls:
        - http://127.0.0.1:8083/api/favoris
      includePaths:
        - 'http://127\.0\.0\.1:8083/api/favoris/client/[0-9]+'
  parameters:
    failOnError: true
    continueOnFailure: false
    progressToStdout: true
jobs:
  - type: passiveScan-config
    parameters:
      scanOnlyInScope: true
  - type: requestor
    requests:
      - url: http://127.0.0.1:8083/api/favoris/client/2026112401
        method: GET
        responseCode: 200
  - type: passiveScan-wait
    parameters:
      maxDuration: 2
  - type: report
    parameters:
      template: traditional-json
      reportDir: .
      reportFile: zap-passive.json
      reportTitle: Favourites local passive scan
  - type: report
    parameters:
      template: traditional-html
      reportDir: .
      reportFile: zap-passive.html
      reportTitle: Favourites local passive scan
