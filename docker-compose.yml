services:

  postgres:
    image: postgres:18
    container_name: agence-immobiliere-db
    environment:
      POSTGRES_USER: agence_admin
      POSTGRES_PASSWORD: agence_password
      POSTGRES_DB: agence_immobiliere
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agence_admin -d agence_immobiliere"]
      interval: 5s
      timeout: 5s
      retries: 5

