server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Listing photos: up to 5 files of 5 MB in one request
    client_max_body_size 30m;

    # Same contract as the Vite dev proxy: /backend/<service>/api/... -> <service>/api/...
    # The trailing slash on proxy_pass strips the /backend/<service> prefix.
    # Origin is cleared because nginx is the single public origin: the services
    # then treat these calls as same-origin instead of applying their CORS lists.
    location /backend/identity/ {
        proxy_pass http://identity-service:8085/;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /backend/announcements/ {
        proxy_pass http://announcements-service:8081/;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /backend/offers/ {
        proxy_pass http://offers-service:8082/;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /backend/favourites/ {
        proxy_pass http://favourites-service:8083/;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /backend/visits/ {
        proxy_pass http://visits-service:8084/;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed build assets can be cached for a long time
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/biens, /connexion, ...) fall back to the SPA
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
